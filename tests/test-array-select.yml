name: Test yq array selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmd: |-
            printf 'items:\n  - name: alpha\n    active: true\n  - name: beta\n    active: false\n' | yq '.items[] | select(.active == true) | .name'
      - name: Assert selected item
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "alpha" ]; then
            echo "FAIL: expected 'alpha' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
