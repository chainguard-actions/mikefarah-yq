name: Test multiline output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmd: yq '.items[]' tests/fixtures/sample.yaml
      - name: Assert multiline result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="$(printf 'apple\nbanana')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected two lines 'apple' and 'banana'"
            exit 1
          fi
          echo "PASS"
