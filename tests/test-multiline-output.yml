name: Test multi-line result output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmd: yq '.items[]' tests/fixtures/sample.yml
      - name: Assert result has all lines
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual:"
          echo "$ACTUAL"
          EXPECTED="$(printf 'alpha\nbeta\ngamma')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected three lines alpha/beta/gamma"
            exit 1
          fi
          echo "PASS"
