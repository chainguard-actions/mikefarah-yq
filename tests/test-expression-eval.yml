name: Test yq expression evaluation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cmd: yq e .count /github/workspace/tests/fixtures/data.yaml

      - name: Assert count value
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTUAL" != "3" ]; then
              echo "FAIL: expected '3' but got '$ACTUAL'"
              exit 1
            fi
            echo "PASS: got '$ACTUAL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker action may not be fully supported under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: action2
        uses: .
        continue-on-error: true
        with:
          cmd: yq e ".fruits | length" /github/workspace/tests/fixtures/data.yaml

      - name: Assert array length
        env:
          ACTUAL: ${{ steps.action2.outputs.result }}
          OUTCOME: ${{ steps.action2.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTUAL" != "3" ]; then
              echo "FAIL: expected '3' but got '$ACTUAL'"
              exit 1
            fi
            echo "PASS: got '$ACTUAL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker action may not be fully supported under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
