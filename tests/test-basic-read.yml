name: Test basic yq read
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cmd: yq e .name /github/workspace/tests/fixtures/test.yaml

      - name: Assert result equals expected value
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTUAL" != "Alice" ]; then
              echo "FAIL: expected 'Alice' but got '$ACTUAL'"
              exit 1
            fi
            echo "PASS: got '$ACTUAL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker action may not be fully supported under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
