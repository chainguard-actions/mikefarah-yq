name: Test yq select filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test YAML file
        run: |
          cat > /tmp/test-input.yaml << 'EOF'
          version: "1.2.3"
          name: myapp
          EOF
      - id: action
        uses: .
        with:
          cmd: eval '.version' /tmp/test-input.yaml
      - name: Assert version output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "1.2.3" ]; then
            echo "FAIL: expected '1.2.3' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
