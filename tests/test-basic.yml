name: Test basic yq usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmd: eval '.greeting' - <<< 'greeting: hello'
      - name: Assert result output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello" ]; then
            echo "FAIL: expected 'hello', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
