name: Test read from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmd: "printf 'project:\n  name: my-project\n  version: 1.2.3\n' | yq e '.project.version' -"
      - name: Assert result equals expected
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "1.2.3" ]; then
            echo "FAIL: expected '1.2.3', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
