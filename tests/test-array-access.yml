name: Test array element access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmd: "printf 'items:\n  - alpha\n  - beta\n  - gamma\n' | yq e '.items[1]' -"
      - name: Assert result equals expected
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "beta" ]; then
            echo "FAIL: expected 'beta', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
