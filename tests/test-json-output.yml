name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cmd: yq -o=json -I=0 '.nested' tests/fixtures/sample.yml
      - name: Assert result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != '{"key":"value","count":3}' ]; then
            echo "FAIL: expected compact JSON {\"key\":\"value\",\"count\":3}"
            exit 1
          fi
          echo "PASS"
