name: Test yq query on committed fixture file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: read-version
        uses: .
        continue-on-error: true
        with:
          cmd: yq '.app.version' /github/workspace/tests/fixtures/sample.yaml

      - name: Assert version output
        env:
          ACTUAL: ${{ steps.read-version.outputs.result }}
          OUTCOME: ${{ steps.read-version.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTUAL" != "2.5.1" ]; then
              echo "FAIL: expected '2.5.1' but got '$ACTUAL'"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker action may not be fully supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: read-replicas
        uses: .
        continue-on-error: true
        with:
          cmd: yq '.app.replicas' /github/workspace/tests/fixtures/sample.yaml

      - name: Assert replicas output
        env:
          ACTUAL: ${{ steps.read-replicas.outputs.result }}
          OUTCOME: ${{ steps.read-replicas.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTUAL" != "3" ]; then
              echo "FAIL: expected '3' but got '$ACTUAL'"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker action may not be fully supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: read-first-tag
        uses: .
        continue-on-error: true
        with:
          cmd: yq '.app.tags[0]' /github/workspace/tests/fixtures/sample.yaml

      - name: Assert first tag output
        env:
          ACTUAL: ${{ steps.read-first-tag.outputs.result }}
          OUTCOME: ${{ steps.read-first-tag.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTUAL" != "production" ]; then
              echo "FAIL: expected 'production' but got '$ACTUAL'"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker action may not be fully supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
