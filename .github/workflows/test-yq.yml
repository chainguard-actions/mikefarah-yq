name: Test Yq Action
on: 
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get test
        id: get_value
        uses: mikefarah/yq@e2f1d5ccf73239195bf92280cd47596751492449 # master
        with:
          cmd: yq '.test' examples/multiline-text.yaml
      - name: Multiline test
        env:
          RESULT: ${{ steps.get_value.outputs.result }}
        run: echo "### It was [$RESULT]" >> $GITHUB_STEP_SUMMARY
      - name: Write inplace test
        id: lookupSdkVersion
        uses: mikefarah/yq@e2f1d5ccf73239195bf92280cd47596751492449 # master
        with:
          cmd: yq -i '.b.c = 5' examples/sample.yaml