name: Release Snap

on:
  release:
    types: [released]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
    buildSnap:
      environment: snap
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
          id: build
          env:
            SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
          with:
            snapcraft-args: "remote-build --launchpad-accept-public-upload"
        - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
          env:
            SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
          with:
            snap: ${{ steps.build.outputs.snap }}
            release: stable
