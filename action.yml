name: 'yq - portable yaml processor'
description: 'create, read, update, delete, merge, validate and do more with yaml'
branding:
  icon: command
  color: gray-dark
inputs:
  cmd:
    description: 'The Command which should be run, e.g. yq -i ''.foo.bar = "cool"'' config.yml. It is split into arguments honoring shell-style quotes but is NOT evaluated by a shell (no pipes, redirects, command substitution or $VAR expansion); use the yq env() operator to read environment variables.'
    required: true
outputs:
  result:
    description: "The complete result from the yq command being run"
runs:
  using: 'docker'
  image: "docker://mikefarah/yq:4-githubaction@sha256:e1b8c865f299ea6b02910a7ddf147d5d431244d4cc116f89c2148c9f53822906"
  args:
    - ${{ inputs.cmd }}
